name: quality-gates

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore RenPyLocalizationStudio.sln
      - name: Verify formatting
        run: dotnet format RenPyLocalizationStudio.sln --verify-no-changes --no-restore
      - name: Build Release
        run: dotnet build RenPyLocalizationStudio.sln -c Release --no-restore
      - name: Test
        run: dotnet test RenPyLocalizationStudio.sln -c Release --no-build
      - name: Framework-dependent publish smoke
        run: dotnet publish src/RenPyLocalizationStudio.App/RenPyLocalizationStudio.App.csproj -c Release -r win-x64 --self-contained false --no-build -o artifacts/ci-publish
      - name: Reject debug symbols
        shell: pwsh
        run: |
          if (Get-ChildItem artifacts/ci-publish -Filter *.pdb -Recurse) { throw '发布目录包含 PDB。' }
